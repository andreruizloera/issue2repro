name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check src tests examples
      - name: Lint
        run: ruff check src tests examples
      - name: Tests
        run: python -m pytest -q
      - name: Demo
        run: ./demo.sh

  verify-in-docker:
    # The demo above runs `verify` on the host so it works anywhere. This job
    # runs the same reproduction through the containerized path that is the
    # command's default, on a runner that actually has Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Confirm Docker is present
        run: docker version --format '{{.Server.Version}}'
      - name: Demo with the container path
        env:
          DEMO_VERIFY_DOCKER: "1"
        run: ./demo.sh
